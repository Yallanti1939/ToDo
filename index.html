<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Minimal & Premium To-Do</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </div>
                <div>
                    <h1>TaskFlow</h1>
                    <p class="subtitle" id="current-date">Today</p>
                </div>
            </div>

            <div class="header-actions">
                <!-- Export / Options Dropdown -->
                <div class="dropdown">
                    <button class="icon-btn" id="export-dropdown-btn" title="Export / Options">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="export-menu">
                        <button id="export-json-btn">Export as JSON</button>
                        <button id="export-csv-btn">Export as CSV</button>
                    </div>
                </div>

                <!-- Theme Toggle -->
                <button class="icon-btn theme-toggle" id="theme-toggle-btn" title="Toggle Theme (Light / Dark)">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Progress Overview Card -->
        <div class="progress-card">
            <div class="progress-header">
                <div class="progress-info">
                    <span class="progress-label">Productivity Progress</span>
                    <span class="progress-percentage" id="progress-percent">0%</span>
                </div>
                <span class="task-summary-badge" id="task-summary-text">0 of 0 completed</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Add Task Card -->
        <form class="task-input-card" id="task-form">
            <div class="input-main-row">
                <input type="text" id="task-title-input" placeholder="What do you need to accomplish today?"
                    autocomplete="off" required />
                <button type="submit" class="primary-btn" id="add-task-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <span>Add Task</span>
                </button>
            </div>

            <!-- Extended Options -->
            <div class="input-details-row">
                <div class="option-pill">
                    <label for="task-category-select">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" />
                            <line x1="7" y1="7" x2="7.01" y2="7" />
                        </svg>
                    </label>
                    <select id="task-category-select">
                        <option value="General">General</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                        <option value="Personal">Personal</option>
                        <option value="Shopping">Shopping</option>
                    </select>
                </div>

                <div class="option-pill">
                    <label for="task-priority-select">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon
                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                        </svg>
                    </label>
                    <select id="task-priority-select">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                </div>

                <div class="option-pill">
                    <label for="task-due-date-input">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                    </label>
                    <input type="date" id="task-due-date-input" />
                </div>
            </div>
        </form>

        <!-- Filter & Search Controls -->
        <div class="controls-toolbar">
            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="search-input" placeholder="Search tasks... (Press / to focus)" />
                <button id="clear-search-btn" class="clear-search-btn hidden" title="Clear Search">&times;</button>
            </div>

            <div class="filters-row">
                <!-- Status Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">All <span class="badge"
                            id="count-all">0</span></button>
                    <button class="filter-btn" data-filter="pending">Pending <span class="badge"
                            id="count-pending">0</span></button>
                    <button class="filter-btn" data-filter="completed">Done <span class="badge"
                            id="count-completed">0</span></button>
                </div>

                <!-- Category Dropdown Filter -->
                <select class="category-filter-select" id="filter-category-select">
                    <option value="all">All Categories</option>
                    <option value="General">General</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Personal">Personal</option>
                    <option value="Shopping">Shopping</option>
                </select>
            </div>
        </div>

        <!-- Task List Container -->
        <main class="task-list-wrapper">
            <ul class="task-list" id="task-list">
                <!-- Tasks rendered via JavaScript -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state hidden" id="empty-state">
                <div class="empty-icon">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                </div>
                <h3 id="empty-title">No tasks found</h3>
                <p id="empty-subtitle">Add a task above or adjust your search and filters.</p>
            </div>
        </main>

        <!-- Footer Stats & Actions -->
        <footer class="app-footer">
            <div class="stats-counter">
                <span>Total: <strong id="stat-total">0</strong></span>
                <span class="divider">•</span>
                <span>Pending: <strong id="stat-pending">0</strong></span>
                <span class="divider">•</span>
                <span>Completed: <strong id="stat-completed">0</strong></span>
            </div>
            <button class="text-danger-btn" id="clear-completed-btn">Clear Completed</button>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Edit Task Modal -->
    <div class="modal-overlay hidden" id="edit-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="icon-btn close-modal-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-task-id" />
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="edit-task-title" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="edit-task-category">
                            <option value="General">General</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                            <option value="Personal">Personal</option>
                            <option value="Shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="edit-task-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="edit-task-due-date" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancel-edit-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
